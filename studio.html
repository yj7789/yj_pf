<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>

<title>SOLVAKIN Studio — Portfolio Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b;--surface:#0d0f13;--panel:#121419;--raised:#191c22;--text:#f5f6f7;--muted:#9ca2ac;--subtle:#676e79;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.055);--accent:#ff6b47;--accent-soft:rgba(255,107,71,.1);
  --success:#7adc8a;--warning:#f2bd61;--danger:#ff626d;--top:64px;--radius:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;font-size:13px}
button,input,select{font:inherit}button{color:inherit}button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer}.mono{font-family:'JetBrains Mono',monospace}.muted{color:var(--muted)}.hidden{display:none!important}
.topbar{height:var(--top);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:rgba(13,15,19,.94);backdrop-filter:blur(18px);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand strong{font-size:14px;letter-spacing:-.03em}.brand strong span{color:var(--accent)}
.brand small{padding-left:12px;border-left:1px solid var(--line);color:var(--subtle);font:10px 'JetBrains Mono',monospace;letter-spacing:.09em}
.save-state{display:inline-flex;align-items:center;gap:7px;margin-left:6px;color:var(--muted);font-size:11px;white-space:nowrap}.save-state i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(122,220,138,.08)}.save-state.dirty i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.top-actions{display:flex;align-items:center;gap:6px;overflow-x:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025);color:var(--muted);font-size:11px;font-weight:650;text-decoration:none;white-space:nowrap}.btn:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--text)}.btn.primary{border-color:var(--text);background:var(--text);color:#0b0c0f}.btn.accent{border-color:var(--accent);background:var(--accent);color:#1b0905}.btn.danger{color:var(--danger)}.btn.icon{width:36px;padding:0}.btn:disabled{opacity:.4;cursor:not-allowed}
.mobile-files{display:none;position:relative}.mobile-files summary{list-style:none}.mobile-files summary::-webkit-details-marker{display:none}.mobile-files-menu{position:fixed;top:52px;right:8px;z-index:70;display:grid;min-width:190px;padding:7px;border:1px solid var(--line);border-radius:13px;background:rgba(18,20,25,.98);box-shadow:0 22px 70px rgba(0,0,0,.55);backdrop-filter:blur(18px)}.mobile-files-menu button,.mobile-files-menu a{justify-content:flex-start;width:100%;border-color:transparent}
.workspace{height:calc(100dvh - var(--top));display:grid;grid-template-columns:280px minmax(440px,1fr) 390px;grid-template-areas:'rail preview inspector';overflow:hidden}
.rail,.inspector{min-width:0;overflow:auto;background:var(--surface);scrollbar-color:var(--line) transparent}.rail{grid-area:rail;border-right:1px solid var(--line)}.inspector{grid-area:inspector;border-left:1px solid var(--line)}
.panel-head{position:sticky;top:0;z-index:5;padding:18px 16px 14px;border-bottom:1px solid var(--line);background:rgba(13,15,19,.94);backdrop-filter:blur(16px)}
.eyebrow{margin:0 0 5px;color:var(--accent);font:9px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.panel-head h1,.panel-head h2{margin:0;font-size:15px;letter-spacing:-.025em}.panel-head p{margin:6px 0 0;color:var(--subtle);font-size:11px;line-height:1.55}
.section-block{border-bottom:1px solid var(--line2)}.section-title{display:flex;align-items:center;gap:8px;padding:14px 13px 8px}.section-title strong{flex:1;font-size:11px}.section-count{color:var(--subtle);font:9px 'JetBrains Mono',monospace}.mini-actions{display:flex;gap:3px}.mini{display:grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--subtle);font-size:13px}.mini:hover{border-color:var(--line);background:rgba(255,255,255,.04);color:var(--text)}
.placement-list{padding:0 8px 12px}.placement-item{position:relative;display:grid;grid-template-columns:14px 42px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:56px;margin:3px 0;padding:6px;border:1px solid transparent;border-radius:12px;cursor:pointer;transition:.15s}.placement-item:hover{background:rgba(255,255,255,.035)}.placement-item.selected{border-color:rgba(255,107,71,.48);background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}.placement-item.dragging{opacity:.35}.placement-item.drop-before::before{content:'';position:absolute;top:-3px;left:6px;right:6px;height:2px;border-radius:2px;background:var(--accent)}
.drag{color:var(--subtle);font-size:13px;cursor:grab}.placement-thumb{width:42px;height:42px;border:1px solid var(--line);border-radius:9px;object-fit:cover;background:var(--raised)}.placement-copy{min-width:0}.placement-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.placement-copy small{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--subtle);font:8px 'JetBrains Mono',monospace}.placement-item.is-hidden .placement-thumb,.placement-item.is-hidden .placement-copy{opacity:.38}.row-actions{display:flex;align-items:center;gap:1px}.row-actions .mini{width:26px;height:26px}
.preview{grid-area:preview;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:#07080a}.preview-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.live{display:flex;align-items:center;gap:7px;color:var(--muted);font:9px 'JetBrains Mono',monospace;letter-spacing:.07em}.live i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.segmented{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#090a0d}.segmented button{min-height:30px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--subtle);font-size:10px}.segmented button.on{background:var(--raised);color:var(--text)}
.interaction{display:flex;align-items:center;gap:7px;color:var(--subtle);font-size:10px}.interaction input{accent-color:var(--accent)}
.preview-stage{flex:1;display:flex;align-items:flex-start;justify-content:center;min-height:0;padding:16px;overflow:auto;background-color:#090a0c;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:24px 24px}
.preview-fit{position:relative;flex:0 0 auto}.preview-shell{position:absolute;top:0;left:0;width:1440px;height:900px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 28px 80px rgba(0,0,0,.42);transform-origin:top left}.preview-shell iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.inspector-body{padding:12px}.editor-card{margin-bottom:10px;border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden}.editor-card>summary{display:flex;align-items:center;gap:9px;min-height:46px;padding:0 13px;cursor:pointer;list-style:none;font-size:12px;font-weight:650}.editor-card>summary::-webkit-details-marker{display:none}.editor-card>summary::after{content:'⌄';margin-left:auto;color:var(--subtle)}.editor-card[open]>summary::after{transform:rotate(180deg)}.editor-content{padding:0 13px 14px;border-top:1px solid var(--line2)}
.field{display:grid;gap:7px;margin-top:13px}.field>label,.field-label{color:var(--muted);font-size:10px;font-weight:600}.field-help{color:var(--subtle);font-size:9px;line-height:1.5}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control{width:100%;min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#0b0d10;color:var(--text);font-size:11px}.control:hover{border-color:rgba(255,255,255,.18)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}.toggle{position:relative;width:38px;height:22px;flex:0 0 auto}.toggle input{position:absolute;opacity:0}.toggle span{position:absolute;inset:0;border:1px solid var(--line);border-radius:20px;background:#0a0b0e;transition:.2s}.toggle span::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--subtle);transition:.2s}.toggle input:checked+span{border-color:rgba(255,107,71,.6);background:var(--accent-soft)}.toggle input:checked+span::after{transform:translateX(16px);background:var(--accent)}
.crop-stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;margin-top:13px;border:1px solid var(--line);border-radius:12px;background:#090a0c}.crop-stage.card-crop{aspect-ratio:4/3}.crop-stage img{width:100%;height:100%;object-fit:cover}.crop-stage::before,.crop-stage::after{content:'';position:absolute;z-index:2;pointer-events:none;background:rgba(255,255,255,.42)}.crop-stage::before{left:50%;top:calc(50% - 6px);width:1px;height:13px}.crop-stage::after{top:50%;left:calc(50% - 6px);width:13px;height:1px}.crop-badge{position:absolute;left:9px;bottom:8px;z-index:3;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:rgba(5,6,8,.72);color:#fff;font:8px 'JetBrains Mono',monospace;backdrop-filter:blur(8px)}
.range-row{display:grid;grid-template-columns:14px 1fr 42px;align-items:center;gap:7px;margin-top:9px;color:var(--subtle);font:9px 'JetBrains Mono',monospace}.range-row input{width:100%;accent-color:var(--accent)}.range-row output{text-align:right;color:var(--muted)}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 1px}.card-meta strong{font-size:14px;letter-spacing:-.03em}.id-badge{padding:4px 6px;border:1px solid var(--line);border-radius:7px;color:var(--subtle);font:8px 'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis}
.inline-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.inline-actions .btn{flex:1;min-width:105px}
.gallery-list{display:grid;gap:7px;margin-top:11px}.gallery-item{display:grid;grid-template-columns:12px 52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px;border:1px solid var(--line2);border-radius:11px;background:#0d0f12}.gallery-item.dragging{opacity:.35}.gallery-item.drop-before{border-top-color:var(--accent)}.gallery-item img{width:52px;height:43px;border-radius:7px;object-fit:cover;background:var(--raised)}.gallery-info{min-width:0}.gallery-info strong{display:block;font:9px 'JetBrains Mono',monospace}.gallery-info small{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--subtle);font:8px 'JetBrains Mono',monospace}.gallery-tools{display:flex;align-items:center;gap:3px}.span-select{width:65px;height:30px;padding:0 5px;border:1px solid var(--line);border-radius:8px;background:#090a0d;color:var(--muted);font-size:9px}.gallery-item.is-hidden img,.gallery-item.is-hidden .gallery-info{opacity:.35}
.empty{padding:24px 12px;text-align:center;color:var(--subtle);font-size:11px;line-height:1.7}.notice{margin:10px 0 0;padding:10px;border:1px solid rgba(242,189,97,.2);border-radius:10px;background:rgba(242,189,97,.05);color:#c8ad7b;font-size:9px;line-height:1.6}
dialog{width:min(920px,calc(100% - 28px));max-height:min(760px,calc(100dvh - 28px));padding:0;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--text);box-shadow:0 40px 120px rgba(0,0,0,.7)}dialog::backdrop{background:rgba(2,3,5,.8);backdrop-filter:blur(16px)}
.dialog-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);background:rgba(13,15,19,.94);backdrop-filter:blur(16px)}.dialog-head h2{margin:0;flex:1;font-size:15px}.search{width:min(300px,40vw)}
.asset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:14px;max-height:520px;overflow:auto}.asset{position:relative;aspect-ratio:4/3;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--raised)}.asset:hover{border-color:var(--accent)}.asset img{width:100%;height:100%;object-fit:cover}.asset span{position:absolute;left:6px;right:6px;bottom:6px;padding:5px;border-radius:6px;background:rgba(5,6,8,.76);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font:7px 'JetBrains Mono',monospace;text-align:left;backdrop-filter:blur(7px)}
.custom-path{display:flex;gap:7px;padding:12px 14px 15px;border-top:1px solid var(--line)}.custom-path input{flex:1}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:360px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(24,27,33,.94);box-shadow:0 18px 55px rgba(0,0,0,.45);color:var(--text);font-size:11px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:none}
@media(max-width:1200px){body{overflow:hidden}.workspace{height:calc(100dvh - var(--top));min-height:0;grid-template-columns:260px minmax(0,1fr);grid-template-rows:42% 58%;grid-template-areas:'rail preview' 'rail inspector';overflow:hidden}.rail{grid-row:1/3;height:auto}.preview{position:relative;top:auto;z-index:14;height:auto;min-height:0}.inspector{height:auto;overflow:auto;border-left:0;border-top:1px solid var(--line);scroll-margin-top:0}.inspector-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.editor-card{margin:0}.panel-head{position:relative;grid-column:1/-1}}
@media(max-width:760px){:root{--top:56px}body{overflow:auto}.topbar{padding:0 9px 0 13px}.brand{gap:5px}.brand strong{font-size:12px}.brand small,.top-actions>.secondary,.save-state span{display:none}.mobile-files{display:block}.save-state{margin-left:0}.top-actions{margin-left:auto;overflow:visible}.btn{min-height:42px;padding:0 9px}.workspace{display:flex;height:auto;min-height:calc(100dvh - var(--top));overflow:visible;flex-direction:column}.preview{order:1;position:sticky;top:var(--top);height:52dvh;min-height:400px}.rail{order:2;height:auto;max-height:none;border-right:0;border-top:1px solid var(--line)}.inspector{order:3;height:auto;overflow:visible;scroll-margin-top:calc(max(52dvh,400px) + var(--top) + 8px)}.preview-stage{padding:8px}.preview-shell{border-radius:12px}.inspector-body{display:block}.editor-card{margin-bottom:9px}.asset-grid{grid-template-columns:repeat(2,1fr)}.dialog-head{flex-wrap:wrap}.dialog-head .search{order:3;width:100%}.placement-item{min-height:66px}.mini{width:40px;height:40px}.row-actions .mini{width:40px;height:40px}.gallery-item{grid-template-columns:12px 52px minmax(0,1fr);padding:8px}.gallery-tools{grid-column:2/-1;justify-content:flex-end}.gallery-tools .mini{width:40px;height:40px}.span-select{width:78px;height:40px}.top-actions .btn span{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>SOLVAKIN <span>/ STUDIO</span></strong><small>PORTFOLIO COMPOSER</small><span class="save-state" id="save-state"><i></i><span>불러오는 중</span></span></div>
  <div class="top-actions">
    <button class="btn secondary" id="import-btn" type="button">JSON 가져오기</button>
    <button class="btn secondary" id="export-btn" type="button">백업 내보내기</button>
    <button class="btn secondary" id="reset-btn" type="button">기본값 복원</button>
    <a class="btn secondary" href="index.html" target="_blank" rel="noopener">공개본 ↗</a>
    <button class="btn accent" id="publish-btn" type="button">사이트 파일 저장</button>
    <button class="btn primary" id="save-btn" type="button">초안 저장 <span>⌘S</span></button>
    <details class="mobile-files"><summary class="btn icon" aria-label="파일 메뉴">•••</summary><div class="mobile-files-menu"><button class="btn" data-mobile-action="import" type="button">JSON 가져오기</button><button class="btn" data-mobile-action="export" type="button">백업 내보내기</button><button class="btn danger" data-mobile-action="reset" type="button">기본값 복원</button><a class="btn" href="index.html" target="_blank" rel="noopener">공개본 열기 ↗</a></div></details>
  </div>
</header>

<main class="workspace">
  <aside class="rail">
    <div class="panel-head"><p class="eyebrow">01 · ORDER</p><h1>화면 배치</h1><p>드래그하거나 화살표로 순서와 카테고리를 바꿉니다.</p></div>
    <div id="placement-root"><div class="empty">포트폴리오 데이터를 불러오는 중입니다.</div></div>
  </aside>

  <section class="preview">
    <div class="preview-bar">
      <span class="live"><i></i> LIVE PREVIEW</span>
      <div class="segmented" id="device-switch" aria-label="미리보기 크기">
        <button class="on" data-device="desktop" type="button">1440</button><button data-device="tablet" type="button">820</button><button data-device="mobile" type="button">390</button>
      </div>
      <label class="interaction"><input id="interaction-toggle" type="checkbox"/> 링크 작동</label>
    </div>
    <div class="preview-stage" id="preview-stage"><div class="preview-fit" id="preview-fit"><div class="preview-shell" id="preview-shell" data-device="desktop"><iframe id="preview-frame" title="포트폴리오 실시간 미리보기"></iframe></div></div></div>
  </section>

  <aside class="inspector">
    <div class="panel-head"><p class="eyebrow">02 · INSPECTOR</p><h2>아트 디렉션</h2><p>Hero, 카드 크롭과 프로젝트 갤러리를 조정합니다.</p></div>
    <div class="inspector-body" id="inspector-root"><div class="empty">왼쪽에서 프로젝트 카드를 선택하세요.</div></div>
  </aside>
</main>

<dialog id="asset-dialog">
  <div class="dialog-head"><h2>미디어 라이브러리</h2><input class="control search" id="asset-search" type="search" placeholder="파일명 또는 프로젝트 검색"/><button class="btn icon" id="asset-close" type="button" aria-label="닫기">×</button></div>
  <div class="asset-grid" id="asset-grid"></div>
  <form class="custom-path" id="custom-path-form"><input class="control mono" id="custom-path" placeholder="assets/img/new/my-image.jpg"/><button class="btn primary" type="submit">경로 사용</button></form>
</dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden/>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const EXTRA_ASSETS=['assets/img/survive/12.png','assets/img/survive/13.png','assets/img/thumb/cinema.jpg','assets/img/thumb/elem.jpg','assets/img/thumb/mamul.jpg','assets/img/thumb/playnowz.jpg','assets/img/thumb/survive.jpg'];
const session=(crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36)+Math.random().toString(36).slice(2),targetOrigin=location.origin==='null'?'*':location.origin;
const frame=document.getElementById('preview-frame'),shell=document.getElementById('preview-shell'),previewStage=document.getElementById('preview-stage'),previewFit=document.getElementById('preview-fit'),placementRoot=document.getElementById('placement-root'),inspectorRoot=document.getElementById('inspector-root');
const saveState=document.getElementById('save-state'),assetDialog=document.getElementById('asset-dialog'),assetGrid=document.getElementById('asset-grid'),assetSearch=document.getElementById('asset-search'),toastEl=document.getElementById('toast');
let defaults=null,config=null,catalog=null,selectedPlacement='',dirty=false,previewTimer=0,toastTimer=0,galleryPreviewTimer=0,libraryMode='thumbnail',dragPlacement='',dragGallery='',previewDevice='desktop',editVersion=0;
const pendingRequests=new Map();
frame.src='index.html?studio=1&session='+encodeURIComponent(session);
function clone(value){return JSON.parse(JSON.stringify(value));}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function messageAllowed(event){if(event.source!==frame.contentWindow)return false;if(location.origin!=='null'&&event.origin!==location.origin)return false;var data=event.data;return !!(data&&data.source==='solbakin-portfolio'&&data.version===1&&data.session===session);}
function post(type,payload){if(!frame.contentWindow)return;frame.contentWindow.postMessage(Object.assign({source:'solbakin-studio',version:1,type:type,session:session},payload||{}),targetOrigin);}
function requestId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function project(id){return catalog&&catalog.projects.find(function(item){return item.id===id;})||{id:id,title:id,category:''};}
function section(id){return catalog&&catalog.sections.find(function(item){return item.id===id;})||{id:id,title:id};}
function currentPlacement(){return config&&config.placements.find(function(item){return item.placementId===selectedPlacement;});}
function isDefaultPlacement(id){return defaults&&defaults.placements.some(function(item){return item.placementId===id;});}
function heroCropRatio(){return previewDevice==='mobile'?'4 / 3':previewDevice==='tablet'?'2 / 1':'16 / 10';}

document.getElementById('reset-btn').addEventListener('click',function(){if(!defaults||!confirm('모든 배치와 이미지 조정을 처음 상태로 되돌릴까요?'))return;config=clone(defaults);selectedPlacement=config.placements[0]&&config.placements[0].placementId||'';dirty=true;markDirty();renderAll();toast('기본값으로 되돌렸습니다. 저장 전까지는 초안입니다.');});
document.querySelector('.mobile-files-menu').addEventListener('click',function(event){var button=event.target.closest('[data-mobile-action]');if(!button)return;var map={import:'import-btn',export:'export-btn',reset:'reset-btn'};document.querySelector('.mobile-files').removeAttribute('open');document.getElementById(map[button.dataset.mobileAction]).click();});
document.getElementById('publish-btn').addEventListener('click',async function(){if(!config)return;try{if(window.showSaveFilePicker){var handle=await showSaveFilePicker({suggestedName:'portfolio-config.json',types:[{description:'Portfolio config',accept:{'application/json':['.json']}}]}),writable=await handle.createWritable();await writable.write(configBlob());await writable.close();toast('사이트 설정 파일을 저장했습니다.');}else{downloadConfig('portfolio-config.json');toast('portfolio-config.json을 내려받았습니다.');}}catch(error){if(error.name!=='AbortError')toast('파일을 저장하지 못했습니다.');}});
document.getElementById('import-btn').addEventListener('click',function(){document.getElementById('import-file').click();});document.getElementById('import-file').addEventListener('change',async function(event){var file=event.target.files[0];if(!file)return;try{var incoming=JSON.parse(await file.text());if(!incoming||typeof incoming!=='object'||incoming.schemaVersion!==1||!Array.isArray(incoming.placements))throw Error();clearTimeout(previewTimer);config=incoming;dirty=true;editVersion++;setStatus();var id=requestId();pendingRequests.set(id,{kind:'import',version:editVersion});post('PORTFOLIO_CONFIG_APPLY',{requestId:id,config:config});toast('설정을 가져왔습니다. 검토 후 초안을 저장하세요.');}catch(error){toast('올바른 SOLVAKIN 설정 JSON이 아닙니다.');}event.target.value='';});
function handleConfigResult(data,isSave){var pending=pendingRequests.get(data.requestId);if(!pending)return;pendingRequests.delete(data.requestId);if(pending.version!==editVersion)return;if(!data.ok){toast(data.error||'설정을 적용하지 못했습니다.');return;}var normalizedChanged=false;if(data.config){normalizedChanged=JSON.stringify(data.config)!==JSON.stringify(config);config=data.config;}if(pending.kind==='import'||normalizedChanged){if(!currentPlacement())selectedPlacement=config.placements[0]&&config.placements[0].placementId||'';renderAll();}if(isSave||pending.kind==='save'){dirty=false;setStatus();toast('편집 초안을 저장했습니다.');}}
window.addEventListener('message',function(event){if(!messageAllowed(event))return;var data=event.data;if(data.type==='PORTFOLIO_READY'){if(dirty)return;defaults=data.defaults;config=data.config;catalog=data.catalog;editVersion=0;if(!selectedPlacement)selectedPlacement=config.placements[0]&&config.placements[0].placementId||'';dirty=false;renderAll();fitPreview();}else if(data.type==='PORTFOLIO_CONFIG_RESULT')handleConfigResult(data,false);else if(data.type==='PORTFOLIO_DRAFT_SAVED')handleConfigResult(data,true);else if(data.type==='PORTFOLIO_PLACEMENT_SELECTED'){selectedPlacement=data.placementId;renderAll();focusInspector();}else if(data.type==='PORTFOLIO_HERO_SELECTED'){inspectorRoot.scrollTo({top:0,behavior:'smooth'});focusInspector();}});
fitPreview();frame.addEventListener('load',function(){fitPreview();post('PORTFOLIO_STATE_REQUEST',{});});window.addEventListener('resize',fitPreview);if(window.ResizeObserver)new ResizeObserver(fitPreview).observe(previewStage);
window.addEventListener('keydown',function(event){if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();document.getElementById('save-btn').click();}});window.addEventListener('beforeunload',function(event){if(dirty){event.preventDefault();event.returnValue='';}});
</script>
</body>
</html>
